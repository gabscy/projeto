trigger:
- main

pool:
  vmImage: ubuntu-latest

jobs:
- job: Backend
  displayName: 'Deploy Backend'
  steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'
  
  - script: |
      npm install
      npm run build
    workingDirectory: backend
    displayName: 'Build Backend'

  - task: AzureWebApp@1
    inputs:
      azureSubscription: '<your-subscription-name>'
      appName: 'backend'
      package: 'backend/'
      appType: 'webAppLinux'
    displayName: 'Deploy Backend'

- job: Frontend
  displayName: 'Deploy Frontend'
  steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'
  
  - script: |
      npm install
      npm run build
    workingDirectory: frontend
    displayName: 'Build Frontend'

  - task: AzureStaticWebApp@0
    inputs:
      app_location: 'frontend'
      output_location: 'frontend/build'
      azure_static_web_apps_api_token: '<your-deployment-token>'
    displayName: 'Deploy Frontend'
